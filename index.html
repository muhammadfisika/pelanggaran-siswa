<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#0d6efd">

  <meta name="description"
        content="Aplikasi Pelanggaran Siswa SMAN 2 Rangkasbitung">

  <link rel="manifest"
        href="./manifest.json">

  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icons/icon-192.png">

  <title>
    Pelanggaran Siswa - SMAN 2 Rangkasbitung
  </title>

  <link rel="stylesheet"
        href="./style.css">

</head>

<body>


  <!-- =================================================
       LOGIN
  ================================================== -->

  <section
    id="loginPage"
    class="page"
  >

    <div class="login-card">

      <h1>Pelanggaran Siswa</h1>

      <p class="school-name">
        SMAN 2 Rangkasbitung
      </p>

      <h2>Login</h2>

      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
          >

        </div>


        <button
          type="submit"
          class="btn-primary"
        >
          LOGIN
        </button>

      </form>


      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>

  </section>



  <!-- =================================================
       PETUGAS GDS
  ================================================== -->

  <section
    id="gdsPage"
    class="page hidden"
  >

    <div class="dashboard">

      <div class="topbar">

        <div>

          <h1>Petugas GDS</h1>

          <p id="gdsUserName"></p>

        </div>

        <button
          id="logoutGds"
          class="btn-danger"
        >
          Logout
        </button>

      </div>


      <div class="form-card">

        <h2>
          Catat Pelanggaran Siswa
        </h2>


        <div class="form-group">

          <label for="searchSiswa">
            Cari Nama Siswa
          </label>

          <input
            type="text"
            id="searchSiswa"
            placeholder="Ketik nama siswa..."
            autocomplete="off"
          >

        </div>


        <div
          id="hasilSiswa"
          class="search-results"
        ></div>


        <div
          id="siswaTerpilih"
          class="selected-student hidden"
        >

          <div>

            <strong>Siswa Terpilih</strong>

            <div id="namaSiswaTerpilih"></div>

            <small id="infoSiswaTerpilih"></small>

          </div>

          <button
            type="button"
            id="ubahSiswa"
            class="btn-secondary"
          >
            Ganti
          </button>

        </div>


        <form
          id="pelanggaranForm"
          class="hidden"
        >

          <div class="form-group">

            <label for="tanggal">
              Tanggal
            </label>

            <input
              type="date"
              id="tanggal"
              required
            >

          </div>


          <div class="form-group">

            <label for="jenisPelanggaran">
              Jenis Pelanggaran
            </label>

            <select
              id="jenisPelanggaran"
              required
            >

              <option value="">
                Pilih jenis pelanggaran
              </option>

              <option value="ringan">
                Ringan — Bobot 1
              </option>

              <option value="sedang">
                Sedang — Bobot 5
              </option>

              <option value="berat">
                Berat — Bobot 10
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="rincianPelanggaran">
              Rincian Pelanggaran
            </label>

            <select
              id="rincianPelanggaran"
              required
              disabled
            >

              <option value="">
                Pilih jenis terlebih dahulu
              </option>

            </select>

          </div>


          <div class="bobot-box">

            <span>
              Bobot Pelanggaran
            </span>

            <strong id="nilaiBobot">
              -
            </strong>

          </div>


          <div class="form-group">

            <label for="waktu">
              Waktu
            </label>

            <input
              type="time"
              id="waktu"
              required
            >

          </div>


          <button
            type="submit"
            class="btn-primary"
            id="btnSimpan"
          >
            SIMPAN PELANGGARAN
          </button>

        </form>


        <div
          id="formMessage"
          class="message"
        ></div>

      </div>

    </div>

  </section>



  <!-- =================================================
       GURU
  ================================================== -->

  <section
    id="guruPage"
    class="page hidden"
  >

    <div class="dashboard">


      <div class="topbar">

        <div>

          <h1>
            Dashboard Guru
          </h1>

          <p id="guruUserName"></p>

        </div>


        <button
          id="logoutGuru"
          class="btn-danger"
        >
          Logout
        </button>

      </div>


      <!-- STATISTIK -->

      <div class="stats-grid">

        <div class="stat-card">

          <span>
            Siswa Melanggar
          </span>

          <strong id="totalSiswa">
            0
          </strong>

        </div>


        <div class="stat-card">

          <span>
            Total Pelanggaran
          </span>

          <strong id="totalPelanggaran">
            0
          </strong>

        </div>


        <div class="stat-card">

          <span>
            Total Bobot
          </span>

          <strong id="totalBobot">
            0
          </strong>

        </div>

      </div>


      <!-- FILTER -->

      <div class="form-card">

        <h2>
          Rekap Pelanggaran
        </h2>


        <div class="filter-grid">

          <div class="form-group">

            <label for="filterKelas">
              Kelas
            </label>

            <select id="filterKelas">

              <option value="">
                Semua Kelas
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="filterTanggal">
              Tanggal
            </label>

            <input
              type="date"
              id="filterTanggal"
            >

          </div>


          <div class="filter-button-area">

            <button
              id="btnResetFilter"
              class="btn-secondary"
              type="button"
            >
              Reset Filter
            </button>

          </div>

        </div>

      </div>


      <!-- RANKING -->

      <div class="form-card">

        <div class="section-header">

          <h2>
            Ranking Pelanggaran Siswa
          </h2>

          <button
            id="btnRefreshGuru"
            class="btn-secondary"
            type="button"
          >
            Refresh
          </button>

        </div>


        <div
          id="loadingGuru"
          class="loading"
        >
          Memuat data...
        </div>


        <div
          id="rankingContainer"
          class="table-wrapper"
        ></div>

      </div>


      <!-- DETAIL -->

      <div
        id="detailSiswaCard"
        class="form-card hidden"
      >

        <div class="section-header">

          <div>

            <h2 id="detailNamaSiswa">
              Detail Siswa
            </h2>

            <p id="detailInfoSiswa"></p>

          </div>


          <button
            id="btnTutupDetail"
            class="btn-secondary"
            type="button"
          >
            Tutup
          </button>

        </div>


        <div
          id="detailPelanggaranContainer"
        ></div>

      </div>


    </div>

  </section>


  <script
    type="module"
    src="app.js"
  ></script>

  <script>
  if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

      navigator.serviceWorker
        .register("./sw.js")
        .then(registration => {
          console.log(
            "Service Worker berhasil:",
            registration.scope
          );
        })
        .catch(error => {
          console.error(
            "Service Worker gagal:",
            error
          );
        });

    });

  }
</script>

</body>
</html>

</body>

</html>
