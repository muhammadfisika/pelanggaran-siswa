<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pelanggaran Siswa</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>


  <!-- =================================================
       LOGIN PAGE
  ================================================== -->

  <section
    id="loginPage"
    class="page"
  >

    <div class="login-card">

      <h1>
        Pelanggaran Siswa
      </h1>

      <p class="school-name">
        SMAN 2 Rangkasbitung
      </p>

      <h2>
        Login
      </h2>


      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
          >

        </div>


        <button
          type="submit"
          class="btn-primary"
        >
          LOGIN
        </button>

      </form>


      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>

  </section>



  <!-- =================================================
       GDS PAGE
  ================================================== -->

  <section
    id="gdsPage"
    class="page hidden"
  >

    <div class="dashboard">


      <!-- TOPBAR -->

      <div class="topbar">

        <div>

          <h1>
            Petugas GDS
          </h1>

          <p id="gdsUserName"></p>

        </div>


        <button
          id="logoutGds"
          class="btn-danger"
        >
          Logout
        </button>

      </div>



      <!-- FORM PELANGGARAN -->

      <div class="form-card">

        <h2>
          Catat Pelanggaran Siswa
        </h2>


        <!-- CARI SISWA -->

        <div class="form-group">

          <label for="searchSiswa">
            Cari Nama Siswa
          </label>

          <input
            type="text"
            id="searchSiswa"
            placeholder="Ketik nama siswa..."
            autocomplete="off"
          >

        </div>


        <!-- HASIL PENCARIAN -->

        <div
          id="hasilSiswa"
          class="search-results"
        ></div>


        <!-- SISWA TERPILIH -->

        <div
          id="siswaTerpilih"
          class="selected-student hidden"
        >

          <div>

            <strong>
              Siswa Terpilih
            </strong>

            <div id="namaSiswaTerpilih"></div>

            <small id="infoSiswaTerpilih"></small>

          </div>


          <button
            type="button"
            id="ubahSiswa"
            class="btn-secondary"
          >
            Ganti
          </button>

        </div>



        <!-- FORM DATA -->

        <form
          id="pelanggaranForm"
          class="hidden"
        >


          <!-- TANGGAL -->

          <div class="form-group">

            <label for="tanggal">
              Tanggal
            </label>

            <input
              type="date"
              id="tanggal"
              required
            >

          </div>



          <!-- JENIS -->

          <div class="form-group">

            <label for="jenisPelanggaran">
              Jenis Pelanggaran
            </label>

            <select
              id="jenisPelanggaran"
              required
            >

              <option value="">
                Pilih jenis pelanggaran
              </option>

              <option value="ringan">
                Ringan — Bobot 1
              </option>

              <option value="sedang">
                Sedang — Bobot 5
              </option>

              <option value="berat">
                Berat — Bobot 10
              </option>

            </select>

          </div>



          <!-- RINCIAN -->

          <div class="form-group">

            <label for="rincianPelanggaran">
              Rincian Pelanggaran
            </label>

            <select
              id="rincianPelanggaran"
              required
              disabled
            >

              <option value="">
                Pilih jenis terlebih dahulu
              </option>

            </select>

          </div>



          <!-- BOBOT -->

          <div class="bobot-box">

            <span>
              Bobot Pelanggaran
            </span>

            <strong id="nilaiBobot">
              -
            </strong>

          </div>



          <!-- WAKTU -->

          <div class="form-group">

            <label for="waktu">
              Waktu
            </label>

            <input
              type="time"
              id="waktu"
              required
            >

          </div>



          <!-- SIMPAN -->

          <button
            type="submit"
            class="btn-primary"
            id="btnSimpan"
          >
            SIMPAN PELANGGARAN
          </button>


        </form>


        <!-- PESAN -->

        <div
          id="formMessage"
          class="message"
        ></div>


      </div>

    </div>

  </section>



  <!-- =================================================
       GURU PAGE
  ================================================== -->

  <section
    id="guruPage"
    class="page hidden"
  >

    <div class="dashboard">

      <div class="topbar">

        <div>

          <h1>
            Guru
          </h1>

          <p id="guruUserName"></p>

        </div>


        <button
          id="logoutGuru"
          class="btn-danger"
        >
          Logout
        </button>

      </div>


      <div class="welcome-card">

        <h2>
          Dashboard Guru
        </h2>

        <p>
          Rekap dan ranking pelanggaran
          akan tersedia pada Tahap 4.
        </p>

      </div>

    </div>

  </section>



  <!-- FIREBASE -->

  <script
    type="module"
    src="app.js"
  ></script>


</body>

</html>
